name: Cloudflare Delivery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: Promote the staging-verified artifact to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-delivery
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated bindings
        run: npm run cf:typegen:check

      - name: Build exact OpenNext artifact
        run: npm run cf:build

      - name: Test artifact inside workerd
        run: npm run cf:test

      - name: Apply staging D1 migrations
        run: npm run cf:d1:migrate:staging

      - name: Deploy staging
        run: npm run cf:deploy:staging

      - name: Smoke-test staging
        if: vars.CLOUDFLARE_STAGING_URL != ''
        run: curl --fail --retry 4 --retry-all-errors "${{ vars.CLOUDFLARE_STAGING_URL }}/api/v1/system/readiness"

      - name: Retain verified artifact for promotion
        uses: actions/upload-artifact@v4
        with:
          name: open-next-${{ github.sha }}
          path: |
            .open-next
            .wrangler/deploy
          include-hidden-files: true
          retention-days: 14

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.promote_to_production
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install deployment tooling
        run: npm ci

      - name: Download the staging-verified artifact
        uses: actions/download-artifact@v4
        with:
          name: open-next-${{ github.sha }}

      - name: Apply production D1 migrations
        run: npm run cf:d1:migrate:production

      - name: Deploy production
        run: npm run cf:deploy:production

      - name: Smoke-test production
        if: vars.CLOUDFLARE_PRODUCTION_URL != ''
        run: curl --fail --retry 4 --retry-all-errors "${{ vars.CLOUDFLARE_PRODUCTION_URL }}/api/v1/system/readiness"
